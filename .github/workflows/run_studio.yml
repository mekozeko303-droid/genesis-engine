name: Genesis Studio Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: genesis-studio-single-instance
  cancel-in-progress: true

jobs:
  run-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg and System Libs
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 || true

      - name: Install Python Libraries Directly
        run: |
          pip install --upgrade pip
          pip install --prefer-binary pyrogram tgcrypto aiohttp requests edge-tts gTTS Pillow opencv-python-headless numpy

      - name: Run Bot
        run: python main.py
