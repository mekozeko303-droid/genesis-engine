name: Genesis Studio Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# هذا القسم يقتل أي عملية قديمة فوراً ويمنع تكرار الرسائل في تيليجرام للأبد
concurrency:
  group: genesis-studio-single-instance
  cancel-in-progress: true

jobs:
  run-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-hosny-amiri fonts-dejavu-core libgl1

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        run: python main.py
