
name: Genesis Cinema Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: genesis-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: تنزيل المستودع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: تثبيت FFmpeg والخط العربي
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: فحص إعدادات الاتصال
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          token = token.strip('"').strip("'").strip()

          api_id = os.getenv("TELEGRAM_API_ID", "").strip()
          api_hash = os.getenv("TELEGRAM_API_HASH", "").strip()

          if not api_id or not api_id.isdigit():
              sys.exit("ERROR: TELEGRAM_API_ID missing or invalid")

          if not api_hash:
              sys.exit("ERROR: TELEGRAM_API_HASH missing")

          if not token:
              sys.exit("ERROR: TELEGRAM_BOT_TOKEN is empty")

          if not re.fullmatch(r"\d+:[A-Za-z0-9_-]+", token):
              sys.exit("ERROR: BOT TOKEN format is invalid")

          print("API_ID: OK")
          print("API_HASH: RECEIVED")
          print("BOT_TOKEN: RECEIVED")
          print("TOKEN FORMAT: OK")
          print("Secret values were not printed.")
          PY

      - name: تشغيل البوت
        env:
          PYTHONUNBUFFERED: "1"

          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_ID: ${{ secrets.TELEGRAM_API_ID }}

          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          PIXABAY_KEY_2: ${{ secrets.PIXABAY_KEY_2 }}

          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TOKEN_2: ${{ secrets.HF_TOKEN_2 }}

          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}

          FONT_FAMILY: "Noto Sans Arabic"
          MAX_RUN_MINUTES: "335"
          PRIVATE_MODE: "1"

        run: python main.py
