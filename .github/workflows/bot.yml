      - name: تشغيل البوت
        env:
          PYTHONUNBUFFERED: "1"

          BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}

          API_ID: ${{ secrets.API_ID || secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.API_HASH || secrets.TELEGRAM_API_HASH }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          PIXABAY_KEY_2: ${{ secrets.PIXABAY_KEY_2 }}

          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TOKEN_2: ${{ secrets.HF_TOKEN_2 }}

          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          FONT_FAMILY: "Noto Sans Arabic"
          MAX_RUN_MINUTES: "335"
          PRIVATE_MODE: "1"

        run: python main.py
