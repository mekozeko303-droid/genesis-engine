name: Genesis Cinema Studio

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # شبكة أمان: إن انتهت الجلسة السابقة تبدأ التالية فوراً

concurrency:
  group: genesis-bot
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: FFmpeg + خط عربي
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل البوت
        run: python main.py
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          PIXABAY_KEY_2: ${{ secrets.PIXABAY_KEY_2 }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TOKEN_2: ${{ secrets.HF_TOKEN_2 }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          FONT_FAMILY: "Noto Sans Arabic"
          MAX_RUN_MINUTES: "335"
